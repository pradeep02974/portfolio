<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Premium Scene Counter</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#4f46e5,#7c3aed,#0ea5e9);
    overflow:hidden;
}

/* Decorative Background */
body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    top:-150px;
    right:-120px;
    filter:blur(10px);
}

body::after{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    bottom:-120px;
    left:-80px;
    filter:blur(10px);
}

/* Main Card */
.card{
    position:relative;
    width:min(92%,480px);
    padding:28px;
    border-radius:26px;

    background:rgba(255,255,255,.14);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 25px 60px rgba(0,0,0,.28);

    color:#fff;
}

/* Badge */
.badge{
    display:inline-block;

    padding:6px 14px;

    border-radius:999px;

    background:rgba(255,255,255,.16);

    font-size:12px;
    font-weight:600;

    letter-spacing:1px;

    text-transform:uppercase;
}

/* Scene */
.scene{
    text-align:center;
    margin:22px 0;
}

.scene h1{
    font-size:48px;
    font-weight:700;
    line-height:1;

    text-shadow:
        0 8px 20px rgba(0,0,0,.25);

    transition:.25s ease;
}

.scene p{
    opacity:.9;
    margin-top:10px;
    font-size:15px;
}

/* Controls */
.controls{
    display:flex;
    gap:12px;
    margin-top:24px;
}

button{
    border:none;
    cursor:pointer;

    transition:.25s ease;

    font-family:inherit;
    font-weight:600;
}

/* Copy Button */
.copy{
    flex:1;

    height:52px;

    border-radius:16px;

    color:#fff;

    font-size:15px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
        );

    box-shadow:
        0 12px 28px rgba(37,99,235,.35);
}

.copy:hover{
    transform:
        translateY(-2px)
        scale(1.02);
}

/* Plus / Minus */
.icon-btn{
    width:52px;
    height:52px;

    border-radius:16px;

    color:#fff;

    font-size:26px;
}

/* Plus */
.plus{
    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    box-shadow:
        0 12px 24px rgba(34,197,94,.35);
}

/* Minus */
.minus{
    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #ea580c
        );

    box-shadow:
        0 12px 24px rgba(245,158,11,.35);
}

.icon-btn:hover{
    transform:
        translateY(-3px)
        rotate(-3deg);
}

.icon-btn:active,
.copy:active{
    transform:scale(.94);
}

/* Scene Indicator */
.counter{
    margin-top:22px;

    display:flex;
    justify-content:center;
    gap:10px;
}

.dot{
    width:10px;
    height:10px;

    border-radius:50%;

    background:rgba(255,255,255,.35);

    transition:.3s;
}

.dot.active{
    width:26px;

    border-radius:20px;

    background:#fff;
}

/* Toast */
.toast{
    position:absolute;

    left:50%;

    bottom:-70px;

    transform:translateX(-50%);

    background:#111827;

    color:#fff;

    padding:12px 18px;

    border-radius:14px;

    font-size:14px;

    white-space:nowrap;

    opacity:0;

    transition:.35s;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

.toast.show{
    bottom:-15px;
    opacity:1;
}

/* Mobile */
@media(max-width:480px){

    .card{
        padding:22px;
    }

    .scene h1{
        font-size:38px;
    }

    .scene p{
        font-size:13px;
    }

    .controls{
        gap:8px;
    }

    .icon-btn{
        width:48px;
        height:48px;
    }

    .copy{
        height:48px;
    }
}

</style>
</head>

<body>

<div class="card">

    <span class="badge">
        Scene Counter
    </span>

    <div class="scene">

        <!-- DEFAULT = SCENE 0 -->
        <h1 id="sceneText">
            Scene 0
        </h1>

        <p>
            Professional Production Counter
        </p>

    </div>

    <div class="controls">

        <!-- COPY -->
        <button
            class="copy"
            onclick="copyScene()">
            📋 Copy
        </button>

        <!-- PLUS -->
        <button
            class="icon-btn plus"
            onclick="changeScene(1)">
            +
        </button>

        <!-- MINUS -->
        <button
            class="icon-btn minus"
            onclick="changeScene(-1)">
            −
        </button>

    </div>

    <!-- INDICATORS -->
    <div class="counter">

        <span class="dot active"></span>

        <span class="dot"></span>

        <span class="dot"></span>

    </div>

    <!-- COPY MESSAGE -->
    <div
        class="toast"
        id="toast">
        Copied: Scene 0
    </div>

</div>


<script>

/* =========================
   DEFAULT SCENE
   ========================= */

let scene = 0;


/* =========================
   ELEMENTS
   ========================= */

const title =
    document.getElementById("sceneText");

const toast =
    document.getElementById("toast");

const dots =
    document.querySelectorAll(".dot");


/* =========================
   RENDER
   ========================= */

function render(){

    /*
       Display current scene
    */

    title.textContent =
        `Scene ${scene}`;


    /*
       Update dots
    */

    dots.forEach(dot => {
        dot.classList.remove("active");
    });


    /*
       Scene 0 = first dot
       Scene 1 = second dot
       Scene 2 = third dot
       Scene 3 = first dot again
    */

    dots[scene % dots.length]
        .classList.add("active");
}


/* =========================
   CHANGE SCENE
   ========================= */

function changeScene(step){

    /*
       Minimum scene = 0
       Scene cannot become negative
    */

    scene =
        Math.max(0, scene + step);

    render();
}


/* =========================
   COPY SCENE
   ========================= */

function copyScene(){

    const text =
        `Scene ${scene}`;

    navigator.clipboard
        .writeText(text)
        .then(() => {

            toast.textContent =
                `✓ Copied: Scene ${scene}`;

            toast.classList.add("show");

            setTimeout(() => {

                toast.classList.remove("show");

            }, 1800);

        })
        .catch(() => {

            toast.textContent =
                `Scene ${scene}`;

            toast.classList.add("show");

            setTimeout(() => {

                toast.classList.remove("show");

            }, 1800);

        });
}


/* =========================
   INITIALIZE
   ========================= */

render();

</script>

</body>
</html>
