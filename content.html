<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f4f4;
  padding:30px;
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.top-bar h2{ color:#111; }

.add-card-btn{
  background:#16a34a;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

/* CARD CONTAINER */
.card-container{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
}

/* CARD */
.card{
  width:320px;
  height:320px;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card h3{ margin-bottom:15px; color:#111; }

/* TEXTAREA */
textarea{
  width:100%;
  height:180px;
  resize:none;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  font-size:14px;
}

/* BUTTONS */
.btn-group{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button{
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  color:#fff;
  transition:0.3s;
}

button:hover{
  opacity:0.9;
  transform:translateY(-2px);
}

.copy-btn{ background:#2563eb; }
.add-btn{ background:#f59e0b; }
.delete-btn{ background:#dc2626; }
.save-btn{ background:#16a34a; margin-top:20px; }

/* TOAST */
#toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  color:#fff;
  padding:12px 20px;
  border-radius:10px;
  opacity:0;
  visibility:hidden;
  transition:0.3s;
}

#toast.show{ opacity:1; visibility:visible; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <h2>Total Cards : <span id="totalCards">0</span></h2>
  <button class="add-card-btn" onclick="addCard()">+ Add Card</button>
</div>

<!-- CARD AREA -->
<div class="card-container" id="cardContainer"></div>

<!-- SAVE BUTTON -->
<button class="save-btn" onclick="saveCards()">Save All Cards</button>

<!-- TOAST -->
<div id="toast">Copied!</div>

<script>
const cardContainer = document.getElementById("cardContainer");

/* LOAD SAVED CARDS */
window.onload = function(){
  const savedCards = JSON.parse(localStorage.getItem("cards")) || [];
  if(savedCards.length > 0){
    savedCards.forEach((cardData, index) => {
      createCard(index + 1, cardData.text);
    });
  } else {
    addCard();
  }
  updateTotal();
}

/* SAVE CARDS */
function saveCards(){
  const cards = [];
  document.querySelectorAll(".card").forEach(card => {
    const text = card.querySelector("textarea").value;
    cards.push({ text });
  });
  localStorage.setItem("cards", JSON.stringify(cards));
  showToast("Cards Saved!");
}

/* UPDATE TOTAL */
function updateTotal(){
  document.getElementById("totalCards").innerText =
    document.querySelectorAll(".card").length;
}

/* CREATE CARD */
function createCard(number, text=""){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div>
      <h3>Card ${number}</h3>
      <textarea placeholder="Write content here..." oninput="saveCards()">${text}</textarea>
    </div>
    <div class="btn-group">
      <button class="copy-btn" onclick="copyContent(this)">Copy</button>
      <button class="add-btn" onclick="duplicateCard(this)">Add</button>
      <button class="delete-btn" onclick="deleteCard(this)">Delete</button>
    </div>
  `;
  cardContainer.appendChild(card);
}

/* ADD CARD (from top bar) */
function addCard(){
  const total = document.querySelectorAll(".card").length + 1;
  createCard(total);
  updateTotal();
  saveCards();
}

/* DUPLICATE CARD (from inside card) */
function duplicateCard(btn){
  const card = btn.closest(".card");
  const text = card.querySelector("textarea").value;
  const total = document.querySelectorAll(".card").length + 1;
  const newCard = document.createElement("div");
  newCard.className = "card";
  newCard.innerHTML = `
    <div>
      <h3>Card ${total}</h3>
      <textarea placeholder="Write content here..." oninput="saveCards()">${text}</textarea>
    </div>
    <div class="btn-group">
      <button class="copy-btn" onclick="copyContent(this)">Copy</button>
      <button class="add-btn" onclick="duplicateCard(this)">Add</button>
      <button class="delete-btn" onclick="deleteCard(this)">Delete</button>
    </div>
  `;
  card.after(newCard);
  updateTotal();
  saveCards();
}

/* COPY */
function copyContent(btn){
  const card = btn.closest(".card");
  const text = card.querySelector("textarea").value;
  navigator.clipboard.writeText(text);
  showToast("Content Copied!");
}

/* DELETE CARD */
function deleteCard(btn){
  btn.closest(".card").remove();
  updateTotal();
  saveCards();
}

/* TOAST */
function showToast(message){
  const toast = document.getElementById("toast");
  toast.innerText = message;
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); },2000);
}
</script>
</body>
</html>
