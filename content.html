<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed Card Size</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f4f4;
  padding:30px;
}

/* TOP BAR */

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.top-bar h2{
  color:#222;
}

.add-card-btn{
  background:#16a34a;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

/* CARD CONTAINER */

.card-container{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
}

/* FIXED CARD SIZE */

.card{
  width:320px;
  height:420px;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* CARD TITLE */

.card h3{
  margin-bottom:15px;
  color:#111;
}

/* TEXTAREA FIXED SIZE */

textarea{
  width:100%;
  height:140px;
  resize:none;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  margin-bottom:15px;
}

/* FEATURES */

.features{
  flex:1;
}

.features strong{
  display:block;
  margin-bottom:10px;
}

.features ul{
  padding-left:18px;
}

.features li{
  margin-bottom:6px;
  color:#444;
}

/* BUTTONS */

.btn-group{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

button{
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  color:#fff;
  font-size:14px;
  transition:0.3s;
}

.copy-btn{
  background:#2563eb;
}

.add-btn{
  background:#f59e0b;
}

.delete-btn{
  background:#dc2626;
}

button:hover{
  opacity:0.9;
  transform:translateY(-2px);
}

</style>
</head>
<body>

<!-- TOP -->

<div class="top-bar">

  <h2>
    Total Cards :
    <span id="totalCards">1</span>
  </h2>

  <button class="add-card-btn" onclick="addCard()">
    + Add Card
  </button>

</div>

<!-- CARD AREA -->

<div class="card-container" id="cardContainer">

  <!-- CARD -->

  <div class="card">

    <div>

      <h3>Card 1</h3>

      <textarea placeholder="Write content here...">Sample content here...</textarea>

      <div class="features">

        <strong>Features</strong>

        <ul>
          <li>Copy Content</li>
          <li>Add Content</li>
          <li>Delete Card</li>
        </ul>

      </div>

    </div>

    <div class="btn-group">

      <button class="copy-btn" onclick="copyContent(this)">
        Copy
      </button>

      <button class="add-btn" onclick="addContent(this)">
        Add
      </button>

      <button class="delete-btn" onclick="deleteCard(this)">
        Delete
      </button>

    </div>

  </div>

</div>

<script>

let cardCount = 1;

/* UPDATE TOTAL */

function updateTotal(){

  document.getElementById("totalCards").innerText =
  document.querySelectorAll(".card").length;

}

/* ADD CARD */

function addCard(){

  cardCount++;

  const card = document.createElement("div");

  card.className = "card";

  card.innerHTML = `

    <div>

      <h3>Card ${cardCount}</h3>

      <textarea placeholder="Write content here..."></textarea>

      <div class="features">

        <strong>Features</strong>

        <ul>
          <li>Copy Content</li>
          <li>Add Content</li>
          <li>Delete Card</li>
        </ul>

      </div>

    </div>

    <div class="btn-group">

      <button class="copy-btn" onclick="copyContent(this)">
        Copy
      </button>

      <button class="add-btn" onclick="addContent(this)">
        Add
      </button>

      <button class="delete-btn" onclick="deleteCard(this)">
        Delete
      </button>

    </div>

  `;

  document.getElementById("cardContainer").appendChild(card);

  updateTotal();

}

/* COPY CONTENT */

function copyContent(btn){

  const card = btn.closest(".card");

  const text = card.querySelector("textarea").value;

  navigator.clipboard.writeText(text);

  alert("Content Copied!");

}

/* ADD CONTENT */

function addContent(btn){

  const card = btn.closest(".card");

  const textarea = card.querySelector("textarea");

  textarea.value += "\nNew Content Added!";

}

/* DELETE CARD */

function deleteCard(btn){

  btn.closest(".card").remove();

  updateTotal();

}

</script>

</body>
</html>
